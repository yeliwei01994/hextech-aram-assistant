[package]
name = "aram-companion"
version = "0.1.1"
description = "A lightweight local-first ARAM companion"
authors = ["ARAM Companion"]
edition = "2021"

[lib]
name = "aram_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
keyring = { version = "4", features = ["v1"] }
sysinfo = "0.40"
tokio = { version = "1", features = ["time"] }
tauri-plugin-global-shortcut = "2.4.1"
